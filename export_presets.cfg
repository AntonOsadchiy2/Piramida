[preset.0]

name="Windows Wallpaper"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="wallpaper,single_process_wallpaper"
export_filter="all_resources"
include_filter="data/balance.json,data/panel-defaults.zip,assets/wallpaper/sky/bright-stars.txt,assets/wallpaper/desktop-extension.txt,assets/wallpaper/desktop-notices.txt,tools/local-panel/server.cjs,tools/local-panel/index.html"
exclude_filter="tests/*,tools/windows-wallpaper/*,tools/test-scenario.ps1,tools/check-giza-sky.gd,docs/*,build/*,Piramida/*"
export_path=""

[preset.0.options]

application/modify_resources=true
application/icon="res://assets/wallpaper/piramida-icon.png"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
debug/export_console_wrapper=0
